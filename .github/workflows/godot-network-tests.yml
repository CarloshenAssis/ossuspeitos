name: Godot network tests

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  network-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: false

      - name: Create log directory
        run: mkdir -p "$RUNNER_TEMP/godot-network-logs"

      - name: godot --version
        run: |
          set -o pipefail
          godot --version 2>&1 | tee "$RUNNER_TEMP/godot-network-logs/version.log"

      - name: Validate project
        run: |
          set -o pipefail
          godot --headless --path . --editor --quit 2>&1 \
            | tee "$RUNNER_TEMP/godot-network-logs/parser.log"

      - name: Validate movement rules
        run: |
          set -o pipefail
          godot --headless --path . --script tests/movement_rules_test.gd 2>&1 \
            | tee "$RUNNER_TEMP/godot-network-logs/movement-rules.log"

      - name: Validate round rules
        run: |
          set -o pipefail
          godot --headless --path . --script tests/round_rules_test.gd 2>&1 \
            | tee "$RUNNER_TEMP/godot-network-logs/round-rules.log"
          grep -q 'ROUND_RULES_TEST_OK' "$RUNNER_TEMP/godot-network-logs/round-rules.log"

      - name: Validate round HUD presentation
        run: |
          set -o pipefail
          godot --headless --path . --script tests/round_hud_test.gd 2>&1 \
            | tee "$RUNNER_TEMP/godot-network-logs/round-hud.log"
          grep -q 'ROUND_HUD_TEST_OK' "$RUNNER_TEMP/godot-network-logs/round-hud.log"

      - name: Validate round authority
        run: |
          set -o pipefail
          godot --headless --path . --script tests/round_authority_test.gd 2>&1 \
            | tee "$RUNNER_TEMP/godot-network-logs/round-authority.log"
          grep -q 'ROUND_AUTHORITY_TEST_OK' "$RUNNER_TEMP/godot-network-logs/round-authority.log"

      - name: Validate shutdown handshake
        run: |
          set -o pipefail
          godot --headless --path . --script tests/shutdown_handshake_test.gd 2>&1 \
            | tee "$RUNNER_TEMP/godot-network-logs/shutdown-handshake.log"
          grep -q 'SHUTDOWN_HANDSHAKE_TEST_OK' "$RUNNER_TEMP/godot-network-logs/shutdown-handshake.log"

      - name: Validate arena layout
        run: |
          set -o pipefail
          godot --headless --path . --script tests/arena_layout_test.gd 2>&1 \
            | tee "$RUNNER_TEMP/godot-network-logs/arena-layout.log"
          grep -q 'ARENA_LAYOUT_TEST_OK' "$RUNNER_TEMP/godot-network-logs/arena-layout.log"

      - name: Validate authoritative weapon and combat rules
        run: |
          set -o pipefail
          for test in weapon_rules inventory_authority combat_rules combat_authority combat_network_coordinator; do
            godot --headless --path . --script "tests/${test}_test.gd" 2>&1 | tee "$RUNNER_TEMP/godot-network-logs/${test}.log"
          done
          grep -q 'WEAPON_RULES_TEST_OK' "$RUNNER_TEMP/godot-network-logs/weapon_rules.log"
          grep -q 'INVENTORY_AUTHORITY_TEST_OK' "$RUNNER_TEMP/godot-network-logs/inventory_authority.log"
          grep -q 'COMBAT_RULES_TEST_OK' "$RUNNER_TEMP/godot-network-logs/combat_rules.log"
          grep -q 'COMBAT_AUTHORITY_TEST_OK' "$RUNNER_TEMP/godot-network-logs/combat_authority.log"
          grep -q 'COMBAT_NETWORK_COORDINATOR_TEST_OK' "$RUNNER_TEMP/godot-network-logs/combat_network_coordinator.log"

      - name: Validate spectator and final reveal rules
        run: |
          set -o pipefail
          for test in spectator_reveal_authority spectator_reveal_client; do
            godot --headless --path . --script "tests/${test}_test.gd" 2>&1 | tee "$RUNNER_TEMP/godot-network-logs/${test}.log"
          done
          grep -q 'SPECTATOR_REVEAL_AUTHORITY_TEST_OK' "$RUNNER_TEMP/godot-network-logs/spectator_reveal_authority.log"
          grep -q 'SPECTATOR_REVEAL_CLIENT_TEST_OK' "$RUNNER_TEMP/godot-network-logs/spectator_reveal_client.log"

      - name: Validate remote avatar facing
        run: |
          set -o pipefail
          godot --headless --path . --script tests/avatar_facing_test.gd 2>&1 \
            | tee "$RUNNER_TEMP/godot-network-logs/avatar-facing.log"
          grep -q 'AVATAR_FACING_TEST_OK' "$RUNNER_TEMP/godot-network-logs/avatar-facing.log"

      - name: Validate arena visual models
        run: |
          set -o pipefail
          godot --headless --path . --script tests/arena_visuals_test.gd 2>&1 \
            | tee "$RUNNER_TEMP/godot-network-logs/arena-visuals.log"
          grep -q 'ARENA_VISUALS_TEST_OK' "$RUNNER_TEMP/godot-network-logs/arena-visuals.log"

      - name: Validate mansion visual identity
        run: |
          set -o pipefail
          godot --headless --path . --script tests/mansion_art_test.gd 2>&1 \
            | tee "$RUNNER_TEMP/godot-network-logs/mansion-art.log"
          grep -q 'MANSION_ART_TEST_OK' "$RUNNER_TEMP/godot-network-logs/mansion-art.log"

      - name: Validate character idle and walk animation
        run: |
          set -o pipefail
          godot --headless --path . --script tests/character_animation_test.gd 2>&1 \
            | tee "$RUNNER_TEMP/godot-network-logs/character-animation.log"
          grep -q 'CHARACTER_ANIMATION_TEST_OK' "$RUNNER_TEMP/godot-network-logs/character-animation.log"

      - name: Validate match HUD transitions
        run: |
          set -o pipefail
          godot --headless --path . --script tests/match_hud_test.gd 2>&1 \
            | tee "$RUNNER_TEMP/godot-network-logs/match-hud.log"
          grep -q 'MATCH_HUD_TEST_OK' "$RUNNER_TEMP/godot-network-logs/match-hud.log"

      - name: Validate combat feedback effects
        run: |
          set -o pipefail
          godot --headless --path . --script tests/combat_feedback_test.gd 2>&1 \
            | tee "$RUNNER_TEMP/godot-network-logs/combat-feedback.log"
          grep -q 'COMBAT_FEEDBACK_TEST_OK' "$RUNNER_TEMP/godot-network-logs/combat-feedback.log"

      - name: Validate public character appearance
        run: |
          set -o pipefail
          godot --headless --path . --script tests/character_appearance_test.gd 2>&1 \
            | tee "$RUNNER_TEMP/godot-network-logs/character-appearance.log"
          grep -q 'CHARACTER_APPEARANCE_TEST_OK' "$RUNNER_TEMP/godot-network-logs/character-appearance.log"

      - name: Validate vertical aim (pitch)
        run: |
          set -o pipefail
          godot --headless --path . --script tests/vertical_aim_test.gd 2>&1 \
            | tee "$RUNNER_TEMP/godot-network-logs/vertical-aim.log"
          grep -q 'VERTICAL_AIM_TEST_OK' "$RUNNER_TEMP/godot-network-logs/vertical-aim.log"

      - name: Run spectator and final reveal network test
        run: |
          set -o pipefail
          for run in 1 2 3; do
            TEST_LOG_DIR="$RUNNER_TEMP/godot-network-logs/spectator-reveal-$run" \
              GODOT_BIN="$(command -v godot)" ./tests/spectator_reveal_network_test.sh 2>&1 \
              | tee "$RUNNER_TEMP/godot-network-logs/spectator-reveal-$run.log"
          done

      - name: Run authoritative combat network test
        run: |
          set -o pipefail
          for run in 1 2 3 4 5; do
            TEST_LOG_DIR="$RUNNER_TEMP/godot-network-logs/combat-processes-$run" \
              GODOT_BIN="$(command -v godot)" ./tests/combat_network_test.sh 2>&1 \
              | tee "$RUNNER_TEMP/godot-network-logs/combat-network-$run.log"
          done

      - name: Run full eight-player mansion match (spectator and next round)
        run: |
          set -o pipefail
          TEST_LOG_DIR="$RUNNER_TEMP/godot-network-logs/combat-eight-processes" \
            COMBAT_CLIENTS=8 COMBAT_EXTENDED=true GODOT_BIN="$(command -v godot)" ./tests/combat_network_test.sh 2>&1 \
            | tee "$RUNNER_TEMP/godot-network-logs/combat-eight.log"
          grep -q 'COMBAT_NETWORK_TEST_OK server=1 clients=8 extended=true' "$RUNNER_TEMP/godot-network-logs/combat-eight.log"

      - name: Run role privacy network test
        env:
          TEST_LOG_DIR: ${{ runner.temp }}/godot-network-logs/round-processes
        run: |
          set -o pipefail
          GODOT_BIN="$(command -v godot)" ./tests/round_network_test.sh 2>&1 \
            | tee "$RUNNER_TEMP/godot-network-logs/round-network.log"

      - name: Run adversarial round test
        env:
          TEST_LOG_DIR: ${{ runner.temp }}/godot-network-logs/adversarial-processes
        run: |
          set -o pipefail
          GODOT_BIN="$(command -v godot)" ./tests/round_adversarial_test.sh 2>&1 \
            | tee "$RUNNER_TEMP/godot-network-logs/adversarial.log"

      - name: Run network smoke test
        env:
          TEST_LOG_DIR: ${{ runner.temp }}/godot-network-logs/processes
        run: |
          set -o pipefail
          GODOT_BIN="$(command -v godot)" ./tests/network_smoke_test.sh 2>&1 \
            | tee "$RUNNER_TEMP/godot-network-logs/network-smoke.log"

      - name: Validate desktop menu and local session rules
        run: |
          set -o pipefail
          godot --headless --path . --script tests/desktop_session_test.gd 2>&1 \
            | tee "$RUNNER_TEMP/godot-network-logs/desktop-session.log"
          grep -q 'DESKTOP_SESSION_TEST_OK' "$RUNNER_TEMP/godot-network-logs/desktop-session.log"

      - name: Run local match through the desktop menu
        env:
          TEST_LOG_DIR: ${{ runner.temp }}/godot-network-logs/local-match-processes
        run: |
          set -o pipefail
          GAME_BIN="$(command -v godot)" ./tests/desktop_local_match_test.sh 2>&1 \
            | tee "$RUNNER_TEMP/godot-network-logs/local-match.log"

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: godot-network-test-logs
          path: ${{ runner.temp }}/godot-network-logs
          if-no-files-found: warn

  # Fase 4: previsão, reconciliação, ordem causal do tiro e interpolação
  # (protocolo 9). Job próprio, em paralelo, para o job acima continuar
  # dentro do seu prazo. O atraso é de aplicação, só de teste
  # (tests/net_delay_peer.gd), com seeds fixas.
  netcode-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: false

      - name: Create log directory
        run: mkdir -p "$RUNNER_TEMP/godot-netcode-logs"

      - name: Validate project
        run: |
          set -o pipefail
          godot --headless --path . --editor --quit 2>&1 \
            | tee "$RUNNER_TEMP/godot-netcode-logs/parser.log"

      - name: Validate prediction, reconciliation and interpolation (layer A)
        run: |
          set -o pipefail
          godot --headless --path . --script tests/netcode_test.gd 2>&1 \
            | tee "$RUNNER_TEMP/godot-netcode-logs/netcode.log"
          grep -q 'NETCODE_TEST_OK' "$RUNNER_TEMP/godot-netcode-logs/netcode.log"

      - name: Validate round reset, pickups and bodies (phase 6)
        run: |
          set -o pipefail
          godot --headless --path . --script tests/round_reset_bodies_test.gd 2>&1 \
            | tee "$RUNNER_TEMP/godot-netcode-logs/round-reset-bodies.log"
          grep -q 'ROUND_RESET_BODIES_TEST_OK' "$RUNNER_TEMP/godot-netcode-logs/round-reset-bodies.log"

      - name: Run real-process sync test under delay profiles (layer B)
        run: |
          set -o pipefail
          for config in "local 1 false" "rtt80 1 false" "rtt150j 3 false" "rtt150j 5 true"; do
            set -- $config
            TEST_LOG_DIR="$RUNNER_TEMP/godot-netcode-logs/sync-$1-$2-$3" PROFILE="$1" SEED="$2" STALL="$3" \
              GODOT_BIN="$(command -v godot)" ./tests/sync_network_test.sh 2>&1 \
              | tee "$RUNNER_TEMP/godot-netcode-logs/sync-$1-$2-$3.log"
            grep -q "SYNC_NETWORK_TEST_OK profile=$1 seed=$2 stall=$3" "$RUNNER_TEMP/godot-netcode-logs/sync-$1-$2-$3.log"
          done

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: godot-netcode-test-logs
          path: ${{ runner.temp }}/godot-netcode-logs
          if-no-files-found: warn

  # Fase 5: partida integrada (8 clientes, 3 rodadas na mesma sessão) e casos
  # adversos, cada um em sessão própria com status de saída esperado por
  # processo. Job próprio, em paralelo, dentro do prazo de 15 minutos.
  match-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: false

      - name: Create log directory
        run: mkdir -p "$RUNNER_TEMP/godot-match-logs"

      - name: Validate project
        run: |
          set -o pipefail
          godot --headless --path . --editor --quit 2>&1 \
            | tee "$RUNNER_TEMP/godot-match-logs/parser.log"

      - name: Run eight-client three-round campaign (local and 150 ms with jitter)
        run: |
          set -o pipefail
          for config in "local 1" "rtt150j 4"; do
            set -- $config
            TEST_LOG_DIR="$RUNNER_TEMP/godot-match-logs/campaign-$1-$2" PROFILE="$1" SEED="$2" \
              GODOT_BIN="$(command -v godot)" ./tests/campaign_test.sh 2>&1 \
              | tee "$RUNNER_TEMP/godot-match-logs/campaign-$1-$2.log"
            grep -q "CAMPAIGN_TEST_OK profile=$1 seed=$2 clients=8 rounds=3" "$RUNNER_TEMP/godot-match-logs/campaign-$1-$2.log"
          done

      - name: Run adverse cases
        run: |
          set -o pipefail
          TEST_LOG_DIR="$RUNNER_TEMP/godot-match-logs/adverse" SEED=1 GODOT_BIN="$(command -v godot)" \
            ./tests/adverse_cases_test.sh 2>&1 | tee "$RUNNER_TEMP/godot-match-logs/adverse.log"
          grep -q 'ADVERSE_CASES_TEST_OK cases=11 ' "$RUNNER_TEMP/godot-match-logs/adverse.log"

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: godot-match-test-logs
          path: ${{ runner.temp }}/godot-match-logs
          if-no-files-found: warn
