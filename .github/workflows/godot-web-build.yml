name: Godot Web build (demo + playtest)

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: "SHA completo de main que será publicado"
        required: false
        default: ""
      publication_mode:
        description: "Offline publica somente a demonstração; online exige sondagem estrita do servidor"
        required: true
        type: choice
        options:
          - offline
          - online
        default: offline
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-web-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      publish_allowed: ${{ steps.release_policy.outputs.allowed }}
      publication_mode: ${{ steps.release_policy.outputs.publication_mode }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Pages release policy
        run: python3 -m unittest discover -s tests -p pages_release_policy_test.py

      - name: Evaluate explicit release approval
        id: release_policy
        env:
          RELEASE_EVENT: ${{ github.event_name }}
          RELEASE_REF: ${{ github.ref }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_APPROVED_SHA: ${{ inputs.release_sha }}
          RELEASE_MODE: ${{ inputs.publication_mode || 'offline' }}
        run: python3 scripts/pages_release_policy.py >> "$GITHUB_OUTPUT"

      - name: Set up Godot with export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: true

      - name: Create output directories
        run: mkdir -p build/web "$RUNNER_TEMP/godot-web-logs"

      - name: godot --version
        run: |
          set -o pipefail
          godot --version 2>&1 | tee "$RUNNER_TEMP/godot-web-logs/version.log"

      - name: Validate project
        run: |
          set -o pipefail
          godot --headless --path . --editor --quit 2>&1 \
            | tee "$RUNNER_TEMP/godot-web-logs/parser.log"

      - name: Validate offline demo
        run: |
          set -o pipefail
          godot --headless --path . -- --mode=demo --demo-test=true 2>&1 \
            | tee "$RUNNER_TEMP/godot-web-logs/demo.log"
          grep -q 'DEMO_TEST_OK simulated_players=4 network=disabled' \
            "$RUNNER_TEMP/godot-web-logs/demo.log"
          ! grep -Eq 'SERVER_|CLIENT_CONNECTING|CLIENT_CONNECTED|CLIENT_CONNECTION_FAILED|CLIENT_SERVER_DISCONNECTED|unable_to_connect' \
            "$RUNNER_TEMP/godot-web-logs/demo.log"
          ! grep -Eq 'ROUND_|ROLE_|ASSASSIN|DETECTIVE|VICTIM' \
            "$RUNNER_TEMP/godot-web-logs/demo.log"
          godot --headless --path . --script tests/visual_demo_mode_test.gd 2>&1 \
            | tee "$RUNNER_TEMP/godot-web-logs/demo-mode.log"
          grep -q 'VISUAL_DEMO_MODE_TEST_OK' "$RUNNER_TEMP/godot-web-logs/demo-mode.log"

      - name: Validate movement rules
        run: |
          set -o pipefail
          godot --headless --path . --script tests/movement_rules_test.gd 2>&1 \
            | tee "$RUNNER_TEMP/godot-web-logs/movement-rules.log"

      - name: Validate round rules
        run: |
          set -o pipefail
          godot --headless --path . --script tests/round_rules_test.gd 2>&1 \
            | tee "$RUNNER_TEMP/godot-web-logs/round-rules.log"
          grep -q 'ROUND_RULES_TEST_OK' "$RUNNER_TEMP/godot-web-logs/round-rules.log"

      - name: Validate round HUD presentation
        run: |
          set -o pipefail
          godot --headless --path . --script tests/round_hud_test.gd 2>&1 \
            | tee "$RUNNER_TEMP/godot-web-logs/round-hud.log"
          grep -q 'ROUND_HUD_TEST_OK' "$RUNNER_TEMP/godot-web-logs/round-hud.log"

      - name: Validate round authority
        run: |
          set -o pipefail
          godot --headless --path . --script tests/round_authority_test.gd 2>&1 \
            | tee "$RUNNER_TEMP/godot-web-logs/round-authority.log"
          grep -q 'ROUND_AUTHORITY_TEST_OK' "$RUNNER_TEMP/godot-web-logs/round-authority.log"

      - name: Validate shutdown handshake
        run: |
          set -o pipefail
          godot --headless --path . --script tests/shutdown_handshake_test.gd 2>&1 \
            | tee "$RUNNER_TEMP/godot-web-logs/shutdown-handshake.log"
          grep -q 'SHUTDOWN_HANDSHAKE_TEST_OK' "$RUNNER_TEMP/godot-web-logs/shutdown-handshake.log"

      - name: Validate arena layout
        run: |
          set -o pipefail
          godot --headless --path . --script tests/arena_layout_test.gd 2>&1 \
            | tee "$RUNNER_TEMP/godot-web-logs/arena-layout.log"
          grep -q 'ARENA_LAYOUT_TEST_OK' "$RUNNER_TEMP/godot-web-logs/arena-layout.log"

      - name: Validate offline visual assets and animation
        run: |
          set -o pipefail
          for test in arena_visuals character_animation avatar_facing mansion_art camera_effects; do
            log="$RUNNER_TEMP/godot-web-logs/$test.log"
            godot --headless --path . --script "tests/${test}_test.gd" 2>&1 | tee "$log"
            grep -Eq "${test^^}_TEST_OK" "$log"
          done

      - name: Validate authoritative weapon and combat rules
        run: |
          set -o pipefail
          for test in weapon_rules inventory_authority combat_rules combat_authority combat_network_coordinator; do
            godot --headless --path . --script "tests/${test}_test.gd" 2>&1 | tee "$RUNNER_TEMP/godot-web-logs/${test}.log"
          done
          grep -q 'WEAPON_RULES_TEST_OK' "$RUNNER_TEMP/godot-web-logs/weapon_rules.log"
          grep -q 'INVENTORY_AUTHORITY_TEST_OK' "$RUNNER_TEMP/godot-web-logs/inventory_authority.log"
          grep -q 'COMBAT_RULES_TEST_OK' "$RUNNER_TEMP/godot-web-logs/combat_rules.log"
          grep -q 'COMBAT_AUTHORITY_TEST_OK' "$RUNNER_TEMP/godot-web-logs/combat_authority.log"
          grep -q 'COMBAT_NETWORK_COORDINATOR_TEST_OK' "$RUNNER_TEMP/godot-web-logs/combat_network_coordinator.log"

      - name: Validate spectator and final reveal rules
        run: |
          set -o pipefail
          for test in spectator_reveal_authority spectator_reveal_client; do
            godot --headless --path . --script "tests/${test}_test.gd" 2>&1 | tee "$RUNNER_TEMP/godot-web-logs/${test}.log"
          done
          grep -q 'SPECTATOR_REVEAL_AUTHORITY_TEST_OK' "$RUNNER_TEMP/godot-web-logs/spectator_reveal_authority.log"
          grep -q 'SPECTATOR_REVEAL_CLIENT_TEST_OK' "$RUNNER_TEMP/godot-web-logs/spectator_reveal_client.log"

      - name: Run spectator and final reveal network test
        env:
          TEST_LOG_DIR: ${{ runner.temp }}/godot-web-logs/spectator-reveal
        run: |
          set -o pipefail
          GODOT_BIN="$(command -v godot)" ./tests/spectator_reveal_network_test.sh 2>&1 \
            | tee "$RUNNER_TEMP/godot-web-logs/spectator-reveal.log"

      - name: Run authoritative combat network test
        env:
          TEST_LOG_DIR: ${{ runner.temp }}/godot-web-logs/combat-processes
        run: |
          set -o pipefail
          GODOT_BIN="$(command -v godot)" ./tests/combat_network_test.sh 2>&1 \
            | tee "$RUNNER_TEMP/godot-web-logs/combat-network.log"

      - name: Validate role privacy
        env:
          TEST_LOG_DIR: ${{ runner.temp }}/godot-web-logs/round-processes
        run: |
          set -o pipefail
          GODOT_BIN="$(command -v godot)" ./tests/round_network_test.sh 2>&1 \
            | tee "$RUNNER_TEMP/godot-web-logs/round-network.log"

      - name: Run adversarial round test
        env:
          TEST_LOG_DIR: ${{ runner.temp }}/godot-web-logs/adversarial-processes
        run: |
          set -o pipefail
          GODOT_BIN="$(command -v godot)" ./tests/round_adversarial_test.sh 2>&1 \
            | tee "$RUNNER_TEMP/godot-web-logs/adversarial.log"

      - name: Validate multiplayer regression
        env:
          TEST_LOG_DIR: ${{ runner.temp }}/godot-web-logs/network-processes
        run: |
          set -o pipefail
          GODOT_BIN="$(command -v godot)" ./tests/network_smoke_test.sh 2>&1 \
            | tee "$RUNNER_TEMP/godot-web-logs/network-smoke.log"

      - name: Export Web demo (offline)
        run: |
          set -o pipefail
          # O preset usa uma cena de entrada offline e uma lista de exclusão de
          # código online. Remover o endpoint apenas durante este export impede
          # que o PCK carregue código/URL de conexão; o projeto original volta
          # antes do export do playtest completo.
          cp project.godot "$RUNNER_TEMP/project.godot.saved"
          restore_project_setting() { cp "$RUNNER_TEMP/project.godot.saved" project.godot; }
          trap restore_project_setting EXIT
          sed -i '/^network\/online_url=/d' project.godot
          sed -i 's@^run/main_scene="res://shared/network_app.tscn"$@run/main_scene="res://client/visual_demo.tscn"@' project.godot
          godot --headless --path . --export-release "Web Demo" build/web/index.html 2>&1 \
            | tee "$RUNNER_TEMP/godot-web-logs/export.log"
          restore_project_setting
          trap - EXIT
          touch build/web/.nojekyll

      # Fase 9: cliente completo no navegador (menu, salas online, partida).
      - name: Export Web playtest (full client)
        run: |
          set -o pipefail
          mkdir -p build/web-playtest
          godot --headless --path . --export-release "Web Playtest" build/web-playtest/index.html 2>&1 \
            | tee "$RUNNER_TEMP/godot-web-logs/export-playtest.log"

      - name: Verify Web artifacts
        run: |
          for dir in build/web build/web-playtest; do
            if [[ ! -s "$dir/index.html" ]]; then
              echo "Missing non-empty Web entry point: $dir/index.html" >&2
              exit 1
            fi
            for extension in wasm pck js; do
              count="$(find "$dir" -maxdepth 1 -type f -name "*.$extension" -size +0c | wc -l)"
              echo "WEB_ARTIFACT_CHECK dir=$dir extension=$extension count=$count"
              if [[ "$count" -lt 1 ]]; then
                echo "Missing non-empty *.$extension Web artifact in $dir" >&2
                exit 1
              fi
            done
          done
          test -f build/web/.nojekyll
          # O cliente Web completo não leva scripts de teste nem coordenadores
          # (o índice de UIDs cita os caminhos; os scripts em si não vão).
          if strings build/web-playtest/index.pck | grep -qE 'tests/[a-z_]+\.gd\.remap'; then
            echo "Web playtest package contains test scripts" >&2
            exit 1
          fi
          if strings build/web/index.pck | grep -Eiq 'ossuspeitos-production\.up\.railway\.app|online-url|web_playtest|CLIENT_CONNECTING|start_client|connect_to_url|transport\.connect_to_url'; then
            echo "Offline demo package contains online endpoint or client markers" >&2
            exit 1
          fi

      - name: Test offline artifact verifier
        run: python3 -m unittest discover -s tests -p offline_site_artifact_test.py

      - name: Install Chromium for the browser test
        run: npx --yes playwright@1.56.1 install --with-deps chromium

      - name: Retain WebSocket packets through a stalled browser poll
        env:
          TEST_LOG_DIR: ${{ runner.temp }}/godot-web-logs/websocket-backlog
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock playwright@1.56.1 >/dev/null
          GODOT_BIN="$(command -v godot)" bash tests/websocket_backlog_test.sh

      # Chromium headless: menu Web (sem criar partida local/LAN, URL de
      # servidor da query ignorada fora de localhost) e uma rodada completa
      # numa sala de um servidor local, com o navegador como 4º jogador.
      - name: Run Web playtest in Chromium
        env:
          TEST_LOG_DIR: ${{ runner.temp }}/godot-web-logs/web-playtest
        run: |
          set -o pipefail
          npm install --no-save --no-package-lock playwright@1.56.1 >/dev/null
          GODOT_BIN="$(command -v godot)" WEB_DIR=build/web-playtest ./tests/web_playtest_test.sh 2>&1 \
            | tee "$RUNNER_TEMP/godot-web-logs/web-playtest.log"

      - name: Assemble offline Pages artifact
        if: steps.release_policy.outputs.publication_mode == 'offline'
        run: |
          mkdir -p build/site-offline
          cp web/site/index.html build/site-offline/index.html
          cp -r build/web build/site-offline/demo
          touch build/site-offline/.nojekyll
          python3 scripts/verify_offline_site.py build/site-offline
          strings build/site-offline/demo/index.pck > "$RUNNER_TEMP/godot-web-logs/offline-package-strings.log"
          if grep -Eiq 'ossuspeitos-production\.up\.railway\.app|online-url|web_playtest|CLIENT_CONNECTING|start_client|connect_to_url|transport\.connect_to_url|/playtest' "$RUNNER_TEMP/godot-web-logs/offline-package-strings.log"; then
            echo "Offline Web package includes online endpoint/client route" >&2
            exit 1
          fi

      - name: Test publication modes
        run: |
          python3 -m unittest discover -s tests -p pages_release_mode_test.py
          python3 -m unittest discover -s tests -p pages_release_policy_test.py

      - name: Run offline demo in Chromium
        if: steps.release_policy.outputs.publication_mode == 'offline'
        env:
          WEB_SHOTS: ${{ runner.temp }}/godot-web-logs/web-demo
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock playwright@1.56.1 >/dev/null
          mkdir -p "$WEB_SHOTS"
          node tests/web_demo_browser.mjs build/site-offline 2>&1 \
            | tee "$RUNNER_TEMP/godot-web-logs/web-demo.log"

      - name: Retain offline demo browser evidence
        if: always() && steps.release_policy.outputs.publication_mode == 'offline'
        uses: actions/upload-artifact@v4
        with:
          name: offline-web-demo-browser-evidence
          path: ${{ runner.temp }}/godot-web-logs/web-demo
          if-no-files-found: warn

      - name: Assemble online Pages artifact
        if: steps.release_policy.outputs.publication_mode == 'online'
        run: |
          mkdir -p build/site-online
          cp web/site/online-index.html build/site-online/index.html
          cp -r build/web build/site-online/demo
          cp -r build/web-playtest build/site-online/playtest
          touch build/site-online/.nojekyll
          find build/site-online -maxdepth 2 -name index.html | sort

      - name: Upload Web demo
        uses: actions/upload-artifact@v4
        with:
          name: armed-mystery-web-demo
          path: build/web
          if-no-files-found: error

      - name: Upload Web playtest
        uses: actions/upload-artifact@v4
        with:
          name: armed-mystery-web-playtest
          path: build/web-playtest
          if-no-files-found: error

      - name: Configure GitHub Pages
        if: steps.release_policy.outputs.allowed == 'true'
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        if: steps.release_policy.outputs.allowed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/site-${{ steps.release_policy.outputs.publication_mode }}

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: godot-web-build-logs
          path: ${{ runner.temp }}/godot-web-logs
          if-no-files-found: warn

  deploy-pages:
    if: needs.build-web-demo.outputs.publish_allowed == 'true'
    needs: build-web-demo
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out approved source
        uses: actions/checkout@v4

      - name: Set up homologated Godot for strict production check
        if: needs.build-web-demo.outputs.publication_mode == 'online'
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: false

      - name: Require current main for offline publication
        if: needs.build-web-demo.outputs.publication_mode == 'offline'
        run: |
          set -euo pipefail
          current_main="$(git ls-remote origin refs/heads/main | cut -f1)"
          test "$current_main" = "$GITHUB_SHA"

      - name: Import complete project
        if: needs.build-web-demo.outputs.publication_mode == 'online'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update && sudo apt-get install -y xvfb xauth libgl1-mesa-dri mesa-vulkan-drivers
          LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a godot --path . --display-driver x11 --audio-driver Dummy --rendering-method gl_compatibility --rendering-driver opengl3 --import 2>&1 | tee "$RUNNER_TEMP/pages-import.log"
          if grep -Eq 'SCRIPT ERROR|Parse Error|^ERROR:' "$RUNNER_TEMP/pages-import.log"; then exit 1; fi
          git show HEAD:project.godot > project.godot

      - name: Require matching production protocol and live snapshots
        if: needs.build-web-demo.outputs.publication_mode == 'online'
        shell: bash
        run: |
          set -euo pipefail
          current_main="$(git ls-remote origin refs/heads/main | cut -f1)"
          test "$current_main" = "$GITHUB_SHA"
          protocol="$(sed -n 's/^const PROTOCOL_VERSION := \([0-9]*\).*/\1/p' shared/network_config.gd)"
          url="$(sed -n 's/^network\/online_url="\(.*\)"$/\1/p' project.godot)"
          test -n "$url"
          status=0
          timeout 45 godot --headless --path . -- --mode=client --probe=true --client-id="release-${GITHUB_RUN_ID: -6}" --url="$url" > "$RUNNER_TEMP/pages-probe.log" 2>&1 || status=$?
          cat "$RUNNER_TEMP/pages-probe.log"
          python3 scripts/pages_release_policy.py --verify-probe "$RUNNER_TEMP/pages-probe.log" --exit-code "$status" --protocol "$protocol"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
