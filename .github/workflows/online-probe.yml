name: Integration diagnostic log reader
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  read-release-preflight-log:
    runs-on: ubuntu-latest
    steps:
      - name: Read completed probe job log without contacting production
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api repos/CarloshenAssis/ossuspeitos/actions/artifacts/12401965715/zip > "$RUNNER_TEMP/probe.zip"
          python3 - "$RUNNER_TEMP/probe.zip" <<'PYLOG'
          import sys
          from zipfile import ZipFile
          with ZipFile(sys.argv[1]) as archive:
              for name in archive.namelist():
                  if not name.endswith('.log'):
                      continue
                  for line in archive.read(name).decode('utf-8', errors='replace').splitlines():
                      if any(key in line for key in ['JOIN_REJECTED', 'protocol_version', 'WEB_TEST_', 'CONNECTION', 'FAILED', 'Error']):
                          message = line.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                          print('::notice title=RELEASE_PREFLIGHT_LOG::' + message)
          PYLOG
