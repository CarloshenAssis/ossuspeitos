name: Integration diagnostic log reader
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  read-release-preflight-log:
    runs-on: ubuntu-latest
    steps:
      - name: Read completed probe job log without contacting production
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api repos/CarloshenAssis/ossuspeitos/actions/jobs/119637566228/logs > "$RUNNER_TEMP/probe.log"
          python3 - "$RUNNER_TEMP/probe.log" <<'PYLOG'
          import sys
          from pathlib import Path
          lines = Path(sys.argv[1]).read_text().splitlines()
          for line in lines:
              if any(key in line for key in ['PROBE_', 'JOIN_REJECTED', 'CLIENT_CONNECTION_FAILED', 'SCRIPT ERROR']):
                  message = line.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                  print('::notice title=RELEASE_PREFLIGHT_LOG::' + message)
          PYLOG
