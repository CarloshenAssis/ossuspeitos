name: Integration browser backlog reproduction
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-backlog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 797862a5f698b4eb4c3ecc6dfa340c1d1d14ed09
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: true
      - name: Install browser
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1 >/dev/null
          npx --yes playwright@1.56.1 install --with-deps chromium
      - name: Exercise real Web client while polling is stalled
        env:
          TEST_LOG_DIR: ${{ runner.temp }}/backlog
        shell: bash
        run: |
          set -o pipefail
          GODOT_BIN="$(command -v godot)" bash tests/websocket_backlog_test.sh
      - name: Record diagnostic result
        if: always()
        shell: bash
        run: |
          python3 - <<'PYLOG'
          import os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'backlog'
          for name in ['import.log','export.log','server.log','browser.log']:
              p=root/name
              if not p.exists(): continue
              text=p.read_text(errors='replace')[-6000:]
              for start in range(0,len(text),3000):
                  msg=(name+'\n'+text[start:start+3000]).replace('%','%25').replace('\r','%0D').replace('\n','%0A')
                  print('::notice title=WEBSOCKET_BACKLOG_DIAGNOSTIC::'+msg)
          PYLOG
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: websocket-backlog-reproduction
          path: ${{ runner.temp }}/backlog
