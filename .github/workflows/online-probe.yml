name: Integration diagnostic log reader
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  read-historical-web-log:
    runs-on: ubuntu-latest
    steps:
      - name: Read completed Web failure artifact without contacting production
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api repos/CarloshenAssis/ossuspeitos/actions/artifacts/12401410321/zip > "$RUNNER_TEMP/historic-web.zip"
          python3 - "$RUNNER_TEMP/historic-web.zip" <<'PYLOG'
          import sys
          from zipfile import ZipFile
          def notice(message):
              message = message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print('::notice title=HISTORIC_WEB_FAILURE_LOG::' + message)
          with ZipFile(sys.argv[1]) as archive:
              notice('FILES\n' + '\n'.join(archive.namelist()))
              for name in archive.namelist():
                  if not name.endswith('.log') or 'web-playtest' not in name:
                      continue
                  data = archive.read(name).decode('utf-8', errors='replace')
                  tail = data[-18000:]
                  for offset in range(0, len(tail), 3000):
                      notice(name + '\n' + tail[offset:offset+3000])
          PYLOG
